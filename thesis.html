<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🎓 پایاپرو | پرامپت‌ساز هوشمند</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #f0f8ff;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      color: #1565c0;
      font-size: 24px;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
      font-size: 16px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin: 8px 4px;
      transition: 0.3s;
    }

    .generate-btn {
      background: #0288d1;
      color: white;
    }

    .generate-btn:hover {
      background: #0277bd;
      transform: scale(1.03);
    }

    .message {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }

      .container {
        padding: 16px;
        border-radius: 12px;
      }

      h2 { font-size: 20px; }

      label, input, textarea, button {
        font-size: 17px;
      }

      button {
        width: 100%;
        margin: 6px 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🧠 پایاپرو | پرامپت‌ساز هوشمند</h2>

  <label>🎯 موضوع تحقیق:</label>
  <input id="topic" placeholder="مثلاً: تأثیر هوش مصنوعی بر آموزش">

  <label>📌 متن نمونه:</label>
  <textarea id="template" rows="10" placeholder="ساختار نمونه را وارد کنید..."></textarea>

  <button class="generate-btn" onclick="generatePrompt()">
    ✨ ساخت و کپی پرامپت
  </button>

  <div id="copyMessage" class="message"></div>

</div>

<script>
function generatePrompt() {
  const topic = document.getElementById('topic').value.trim();
  const template = document.getElementById('template').value.trim();

  if (!topic || !template) {
    alert("⚠️ لطفاً همه فیلدها را پر کنید");
    return;
  }

  const prompt =
`لطفاً یک متن کامل برای موضوع «${topic}» تولید کن.

ساختار، لحن و سازمان‌دهی متن زیر را دقیقاً حفظ کن:

"${template}"

فقط متن نهایی را تولید کن و از توضیحات اضافی خودداری کن.`;

  navigator.clipboard.writeText(prompt)
    .then(() => {
      document.getElementById('copyMessage').innerText =
        "📋 پرامپت ساخته شد. در حال انتقال به پرداخت...";

      setTimeout(() => {
        window.location.href = "https://ppng.ir/d/FLjD";
      }, 1200);

    })
    .catch(() => {
      alert("❌ کپی انجام نشد، اما به صفحه پرداخت منتقل می‌شوید");
      window.location.href = "https://ppng.ir/d/FLjD";
    });
}
</script>

</body>
</html>
